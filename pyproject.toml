[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-parking-projector"
version = "0.1.0"
description = "빔 프로젝터 주차 유도 시스템 개념검증 시뮬레이터"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",        # 헝가리안 매칭 (linear_sum_assignment)
    "pyyaml>=6.0",        # 시나리오 정의
    "fastapi>=0.110",     # 라이브 스트리밍 서버
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "matplotlib>=3.8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["sim*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 시뮬레이션 테스트는 CPU 바운드다. 코어 수만큼 나눠 돌린다.
# --dist loadfile: 한 파일의 테스트는 한 워커가 맡는다 — 무거운 module 스코프
# 픽스처(붐비는 주차장 한 판 등)를 워커마다 다시 만들지 않기 위해서다.
addopts = "-n auto --dist loadfile"
